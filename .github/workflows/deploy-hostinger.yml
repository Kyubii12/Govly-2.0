# Auto-deploy GovLy 2.0 → Hostinger on every push to main.
#
# ONE-TIME: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   FTP_SERVER      = ftp hostname from hPanel → FTP Accounts (often ftp.stacruzbacnotan.com or IP)
#   FTP_USERNAME    = FTP username
#   FTP_PASSWORD    = FTP password
#   FTP_SERVER_DIR  = /public_html/
#
# app/config.php is NEVER uploaded (keeps DB/email passwords only on Hostinger).

name: Deploy to Hostinger

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/README.md
            **/GOVLY2.txt
            **/app/config.php
            **/uploads/ids/**
            **/uploads/selfies/**
            **/uploads/officials/**
