# Auto-deploy GovLy 2.0 → Hostinger on every push to main.
#
# ONE-TIME: GitHub → Settings → Secrets and variables → Actions
#   Secret name:  FTP_PASSWORD
#   Secret value: your Hostinger FTP password
#
# app/config.php is NEVER uploaded (DB/email passwords stay only on Hostinger).

name: Deploy to Hostinger

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FTP password secret
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Missing GitHub secret FTP_PASSWORD. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "FTP_PASSWORD secret is set."

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 156.67.222.119
          username: u108914767
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/stacruzbacnotan.com/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/README.md
            **/GOVLY2.txt
            **/app/config.php
            **/uploads/ids/**
            **/uploads/selfies/**
            **/uploads/officials/**
