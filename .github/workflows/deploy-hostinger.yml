# Auto-deploy GovLy 2.0 → Hostinger on every push to main.
#
# ONE-TIME (required): GitHub → Settings → Secrets and variables → Actions
#   Add repository secret:
#     FTP_PASSWORD = your Hostinger FTP password
#
# Optional overrides (defaults below match this Hostinger account):
#   FTP_SERVER / FTP_USERNAME / FTP_SERVER_DIR
#
# app/config.php is NEVER uploaded (DB/email passwords stay only on Hostinger).

name: Deploy to Hostinger

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FTP password secret
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Missing GitHub secret FTP_PASSWORD."
            echo "Add it at: Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: FTP_PASSWORD"
            echo "Value: your Hostinger FTP password (hPanel → Files → FTP Accounts)"
            exit 1
          fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '156.67.222.119' }}
          username: ${{ secrets.FTP_USERNAME || 'u108914767' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/domains/stacruzbacnotan.com/public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/README.md
            **/GOVLY2.txt
            **/app/config.php
            **/uploads/ids/**
            **/uploads/selfies/**
            **/uploads/officials/**
